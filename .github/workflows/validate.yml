name: Validate PlanarMTO

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run lint
      - name: Persistence regression tests
        run: npx --no-install tsx --test tests/persistence.test.ts
      - name: Typed workspace architecture regression tests
        run: npx --no-install tsx --test tests/project-document.test.ts
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: PHP syntax validation
        run: php -l planar-mto.php
      - name: Verify bundled PDF worker
        run: |
          worker=$(find dist/assets -type f -name 'pdf.worker*.js' -print -quit)
          test -n "$worker"
          test -z "$(find dist/assets -type f -name 'pdf.worker*.mjs' -print -quit)"
          grep -lF "$(basename "$worker")" dist/assets/pdfUnderlayImporter-*.js
          cmp node_modules/pdfjs-dist/build/pdf.worker.min.mjs "$worker"
      - name: Isolated WordPress integration
        run: bash tests/wordpress-integration.sh
